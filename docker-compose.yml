services:
  routine-tracker:
    build: .
    container_name: routine-tracker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4317
      DATABASE_PATH: /app/data/routine-tracker.sqlite
    ports:
      - "4317:4317"
    volumes:
      - ./data:/app/data
